service: '${env:SERVICE_NAME_PREFIX, "local"}'
frameworkVersion: '3'
useDotenv: true

custom:
  secretsPrefix: '/${env:SERVICE_NAME_PREFIX, "/ecom-dev-usea1-ecom-user-service-api"}'

provider:
  name: aws
  runtime: nodejs18.x
  region: ap-south-1
  environment:
    DB_HOST: ${env:DB_HOST, ssm:${self:custom.secretsPrefix}/DB_HOST}  
    DB_NAME: ${env:DB_NAME, ssm:${self:custom.secretsPrefix}/DB_NAME}
    DB_USERNAME: ${env:DB_USER, ssm:${self:custom.secretsPrefix}/DB_USERNAME}
    DB_PASSWORD: ${env:DB_PASSWORD, ssm:${self:custom.secretsPrefix}/DB_PASSWORD}
    DB_PORT: ${env:DB_PORT, ssm:${self:custom.secretsPrefix}/DB_PORT}

functions:
  healthCheck:
    handler: index.handler
    environment:
      key: ${env:API_KEY, ssm:${self:custom.secretsPrefix}/API_KEY}
    events:
      - http:
          method: get
          path: v1/healthcheck    

plugins:
  - serverless-dotenv-plugin
  - serverless-offline